name: Fix BasicMarkedet grammar

on:
  push:
    branches:
      - agent/ufravikelige-rettigheter-og-maktvern

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ufravikelige-rettigheter-og-maktvern
          fetch-depth: 0
      - name: Fix wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('manifest.html')
          text = path.read_text(encoding='utf-8')
          old = 'Alle har fri tilgang til mat gjennom et regulert BasicMarkedet.'
          new = 'Alle har fri tilgang til mat gjennom BasicMarkedet, som reguleres for å sikre rettferdig tilgang og bærekraft.'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one wording match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-basicmarkedet-grammar.yml .github/trigger-fix-basicmarkedet-grammar.txt
          git add manifest.html
          git commit -m "Rett formuleringen om BasicMarkedet"
          git push origin HEAD:agent/ufravikelige-rettigheter-og-maktvern
