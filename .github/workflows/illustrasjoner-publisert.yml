name: Kontroller publiserte illustrasjoner

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "service-worker.js"
      - "tools/check-live-illustrations.mjs"
      - ".github/workflows/illustrasjoner-publisert.yml"

permissions:
  contents: read

jobs:
  public-image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # I en PR skal kontrollen teste den nye sjekk-koden, ikke en eldre
          # kopi på main. Ved manuell produksjonskontroll brukes main.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kontroller offentlig bildevisning og bildefiler
        run: node tools/check-live-illustrations.mjs
