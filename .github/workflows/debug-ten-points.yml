name: Debug ten-point revision

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  debug:
    if: github.head_ref == 'agent/ufravikelige-rettigheter-og-maktvern' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/ufravikelige-rettigheter-og-maktvern
          fetch-depth: 0

      - name: Execute patch and capture result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import traceback

          workflow = Path('.github/workflows/apply-ten-points.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          raw = workflow[start:end]
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in raw.splitlines())
          try:
              compile(code, 'apply-ten-points.py', 'exec')
              exec(code, {'__name__': '__main__'})
          except BaseException:
              Path('debug-ten-points.txt').write_text(traceback.format_exc(), encoding='utf-8')
          else:
              Path('debug-ten-points.txt').write_text('SUCCESS\n', encoding='utf-8')
          PY

      - name: Commit diagnostic or completed patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-ten-points.txt manifest.html grunnlag.html styles.css
          git commit -m "Kjør dokumentrevisjon med diagnostikk" || exit 0
          git push origin HEAD:agent/ufravikelige-rettigheter-og-maktvern
