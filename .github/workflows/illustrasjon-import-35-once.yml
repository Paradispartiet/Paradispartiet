          SRC_34: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/b3df1b2e-7cec-4e25-8017-8250f0545a94/af5e247f-0cd0-4133-b022-89b23a29ed62/Create_ONE_brand_new_distinctive_wide_16_9_painterly_explana.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDMyYmQzZGRmZTUwMDhlOCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTMzODQ2MX0.ns1Tmk-ktrFJaDRB0DZhi9s02HNV_vKAIQ5JCWgtUf4'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 - <<'PY'
          import io, os, time, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps
          names = ["side-forside-trygghet","side-politikk-grunnbehov","side-prosjekter-fra-ide-til-praksis","side-manifest-ufravikelige-rettigheter","side-grunnlag-historie-filosofi-okologi","side-okonomisk-modell-dobbelstruktur","side-kontakt-bli-med","side-om-apen-deltakelse","side-404-vei-videre","prosjekt-aha-samtaler-innsikt","prosjekt-caravan-gronne-korridorer","prosjekt-glasshus-vinterpaviljong","prosjekt-bilfri-by-tilgjengelighet","prosjekt-oldboys-trening-uten-press","prosjekt-paradisavisa-uavhengig-redaksjon","prosjekt-lesebiblioteket-apent-leserom","kort-paradisavisa-kritisk-samtale","kort-aha-kunnskapsnettverk","kort-lesebiblioteket-samtalesirkel","kort-oldboys-lavterskel-aktivitet","kort-glasshus-vinterlys","kort-bilfri-by-gronn-gate","kort-caravan-trygg-sykkelvei","kort-basicmarked-grunnforsyning","kort-teorien-om-lyset-bevissthet","politikk-okonomi-dobbel-markedsstruktur","politikk-offentlig-grunnsortiment-varighet","politikk-bolig-hjem-ikke-spekulasjon","politikk-mat-lokal-matsikkerhet","politikk-helse-fysisk-psykisk-sosial","politikk-utdanning-praksis-og-teori","politikk-arbeidsliv-tid-etter-evne","politikk-miljo-natur-forst","politikk-transport-kollektiv-og-korridorer","politikk-kultur-alle-kan-skape"]
          destination = Path("assets/illustrasjoner")
          destination.mkdir(parents=True, exist_ok=True)
          for index, name in enumerate(names):
              url = os.environ["SRC_" + str(index)]
              assert url.startswith("https://dnznrvs05pmza.cloudfront.net/"), (name, "unexpected host")
              last_error = None
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers={"User-Agent":"Paradispartiet-Illustrasjonsimport/1.0"})
                      with urllib.request.urlopen(request, timeout=70) as response:
                          data = response.read(14_000_000)
                      assert 30_000 < len(data) < 14_000_000, (name, len(data))
                      original = Image.open(io.BytesIO(data))
                      original.load()
                      original = ImageOps.exif_transpose(original).convert("RGB")
                      assert original.width >= 900 and original.height >= 500, (name, original.size)
                      big = destination / (name + ".webp")
                      small = destination / (name + "-960.webp")
                      original.save(big,"WEBP",quality=90,method=6)
                      reduced = original.resize((960,round(960*original.height/original.width)),Image.Resampling.LANCZOS)
                      reduced.save(small,"WEBP",quality=84,method=6)
                      for output in (big,small):
                          raw = output.read_bytes()
                          assert raw[:4] == b"RIFF" and raw[8:12] == b"WEBP", output
                      print(str(index+1)+"/35",name,"original",original.size,"webp",big.stat().st_size,small.stat().st_size,flush=True)
                      break
                  except Exception as error:
                      last_error = error
                      if attempt == 2: raise
                      time.sleep(2*(attempt+1))
          PY
      - name: Sjekk at ingen motiv mangler
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          entries=json.loads(Path("docs/ILLUSTRASJONSPLAN.json").read_text())["images"]
          assert len(entries)==35
          for item in entries:
              for suffix in (".webp","-960.webp"):
                  file=Path("assets/illustrasjoner")/(item["id"]+suffix)
                  assert file.is_file() and file.stat().st_size>15000,file
          print("OK: 70 unike WEBP-filer kontrollert")
          PY
      - name: Commit til arbeidsgrenen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/illustrasjoner/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: 35 tekstforankrede motiv med 70 WEBP-filer"
            git push origin HEAD:refs/heads/design/illustrasjoner-en-gang-innholdsbasert
          fi
