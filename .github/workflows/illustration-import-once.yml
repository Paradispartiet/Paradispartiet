name: Importer illustrasjon (engangsjobb)

on:
  push:
    branches: [design/illustrerte-sider-v1]
    paths:
      - ".github/workflows/illustration-import-once.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/illustrerte-sider-v1
      - name: Last ned godkjent 2K-bilde
        shell: bash
        env:
          IMAGE_URL: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/26cb138e-a1ba-42c6-bdd0-081463e5ae4b/8cfc40aa-8a4e-4fb4-b0c5-1917d144b53b/Use_the_supplied_Paradispartiet_illustrated_vision_as_a_STRI.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDcwOTM5ZTBhMzhjZDEwZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTMyODM1Mn0.KmOV3ffxa77hgQu745q4n1HZT3t9mwtdVlRwDCU50H8'
        run: |
          set -euo pipefail
          mkdir -p assets/illustrasjoner
          curl --fail --location --retry 3 --silent --show-error "$IMAGE_URL" --output /tmp/bilfri-by-original.png
          python3 - <<'PY'
          from pathlib import Path
          b = Path("/tmp/bilfri-by-original.png").read_bytes()
          assert b[:8] == b"\x89PNG\r\n\x1a\n", "Bildet er ikke en PNG-fil"
          assert len(b) > 100000, "Bildet er uventet lite"
          print("PNG nedlastet:", len(b), "bytes")
          PY
      - name: Lag store og små skarpe WEBP-filer
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          im = Image.open("/tmp/bilfri-by-original.png").convert("RGB")
          assert im.width >= 1600 and im.height >= 850, (im.width, im.height)
          folder = Path("assets/illustrasjoner")
          im.save(folder / "bilfri-by.webp", "WEBP", quality=90, method=6)
          width = 960
          small = im.resize((width, round(im.height * width / im.width)), Image.Resampling.LANCZOS)
          small.save(folder / "bilfri-by-960.webp", "WEBP", quality=85, method=6)
          for name in ("bilfri-by.webp", "bilfri-by-960.webp"):
              data = (folder / name).read_bytes()
              assert data[0:4] == b"RIFF" and data[8:12] == b"WEBP", name
              print(name, len(data), "bytes")
          PY
      - name: Lagre motiver på PR-grenen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/illustrasjoner/bilfri-by.webp assets/illustrasjoner/bilfri-by-960.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: legg til Bilfri by i høy oppløsning"
            git push origin HEAD:refs/heads/design/illustrerte-sider-v1
          fi
