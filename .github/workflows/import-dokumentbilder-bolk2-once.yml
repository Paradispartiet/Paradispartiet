name: Importer fem forklaringsillustrasjoner (engangsjobb)

on:
  pull_request:
    types: [opened, synchronize]
    paths: [".github/workflows/import-dokumentbilder-bolk2-once.yml"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/illustrasjoner-forklaringer-bolk2
          persist-credentials: true
      - name: Hent og optimaliser fem originalillustrasjoner
        env:
          SRC_0: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/4d1f79c2-2350-4a1e-8c34-417e47703f4c/21a1c5e4-520a-4ed7-a190-f02dfe8ba196/A_SINGLE_completely_original__highly_detailed_widescreen_16_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWU4NDI5Yzk3ODg2NWNjYiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTI3NzEyOX0.7DQZj1WjsxhKEunZYkTPGOZqfZuvOZ_OTeye89DbbJI'
          SRC_1: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/d7bf4fa2-2a5f-4a10-9d6a-2a2a6c9d3b5d/cc7a9bb1-0ce7-43af-9017-75d28885b21d/A_SINGLE_completely_original__highly_detailed_widescreen_16_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjljZDI5MmY1M2Q0MWIzYiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTMxMDM4M30.aSMCIIzg2xIv4b7JbMpWRVj17lUf2fbS-myRWJ24lYo'
          SRC_2: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/f9223eeb-49dc-441d-ba16-f17308cf4ec7/08870941-1063-4215-9461-ef359205797f/A_SINGLE_completely_original__highly_detailed_widescreen_16_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjNjODI1OWRiYWI0Y2M5YSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTI4MDQxM30.AuQQn05edFhBSneXWf3IGJncabR_o3135bqnKARvhT4'
          SRC_3: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/ce6d4296-3e57-4114-8fc8-6e391dfc2f76/77eda992-a7de-4631-b7bb-32894378d9bd/A_SINGLE_completely_original__highly_detailed_widescreen_16_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNWJkMmFjNzc4MzZiYWUzNyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTMyNjk2N30.ayNNsMMLQCTqCjcO8oYcEXPupjRarJ0R_ApmABMB7TQ'
          SRC_4: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/af0a34ed-b553-4084-95c6-4f70a3767cda/1330c5bf-ac4a-4813-85bb-687adaa3c6aa/A_SINGLE_completely_original__highly_detailed_widescreen_16_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTQ3YWQ4MWU5YjYxODk4OSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTI4NzgzOH0.LxTgHztHy_SyUwfy1tKkaIkjEW_-wTxMrk_-SChIF5o'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 - <<'PY'
          import io, os, time, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps
          names=["forklaring-manifest-frivillig-bosetting","forklaring-manifest-pilot-lokal-laring","forklaring-grunnlag-digitalt-datauttak","forklaring-grunnlag-okologisk-ramme","forklaring-okonomi-avvik-tiltak-revisjon"]
          folder=Path("assets/illustrasjoner")
          folder.mkdir(parents=True,exist_ok=True)
          for i,name in enumerate(names):
              uri=os.environ["SRC_"+str(i)]
              assert uri.startswith("https://dnznrvs05pmza.cloudfront.net/"),name
              for attempt in range(3):
                  try:
                      request=urllib.request.Request(uri,headers={"User-Agent":"Paradispartiet-dokumentimport/1.0"})
                      with urllib.request.urlopen(request,timeout=70) as response:
                          raw=response.read(14_000_000)
                      assert 50000<len(raw)<14_000_000,(name,len(raw))
                      im=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert("RGB")
                      assert im.width>=1200 and im.height>=650,(name,im.size)
                      big=folder/(name+".webp")
                      small=folder/(name+"-960.webp")
                      im.save(big,"WEBP",quality=90,method=6)
                      im.resize((960,round(960*im.height/im.width)),Image.Resampling.LANCZOS).save(small,"WEBP",quality=84,method=6)
                      for path in (big,small):
                          data=path.read_bytes()
                          assert data[:4]==b"RIFF" and data[8:12]==b"WEBP" and len(data)>15000,path
                      print(name,im.size,big.stat().st_size,small.stat().st_size,flush=True)
                      break
                  except Exception:
                      if attempt==2: raise
                      time.sleep(2*(attempt+1))
          assert len(list(folder.glob("forklaring-*.webp"))) >= 24
          PY
      - name: Commit fem bildemotiver på arbeidsgrenen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/illustrasjoner/forklaring-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: fem nye unike forklaringsbilder i ti WebP-filer"
            git fetch origin design/illustrasjoner-forklaringer-bolk2
            git rebase origin/design/illustrasjoner-forklaringer-bolk2
            git push origin HEAD:refs/heads/design/illustrasjoner-forklaringer-bolk2
          fi
