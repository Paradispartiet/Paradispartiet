name: Engangsimport – sju forklaringsmotiver
on:
  pull_request:
    types: [opened, synchronize]
    paths: [".github/workflows/import-forklaringsbilder-once.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/illustrasjoner-dokumentforklaringer
          persist-credentials: true
      - name: Hent og optimaliser motiver
        env:
          SRC_0: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/75e33f7d-70b2-4714-8255-dfa930220a64/cfa90432-2688-4707-bbba-9c1c8afc8a52/Standalone_premium_widescreen_editorial_digital_painting__ri.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDExMjIyNmI4YzBlNTQ0NCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTI2MjY5OX0.m1ZU_pKOJFqQy8SiSR6oUj0SiqiXq38jFzPQ99CxYzY'
          SRC_1: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/0d3d801d-cf44-4aba-a28e-e2c708c8e698/12ff3bb9-8a56-4bad-bee8-a29dd2413f1f/Standalone_premium_widescreen_editorial_digital_painting__ri.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjAyNzA4YzE5MTVjNDc2NiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTMwMjA4MX0.Kysr4bvt0bPGzJ14oo2rY5k87FGy4BaBtsLDy9w0SeA'
          SRC_2: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/e0ce8694-c662-4815-8c3a-6a9a1527f14b/0d0ac00d-0c44-4c29-a281-bbcdb6019423/Standalone_premium_widescreen_editorial_digital_painting__ri.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjJhZGRjYWRlZmM2ZTVjMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTMwOTg2OX0.Ad0Vco37QAlNHsx_pwsk4zTEGlHcxAS2CFvgh4u-yQA'
          SRC_3: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/c255dd1b-ba52-46e4-8355-4459484e07d3/c37ed37c-b18c-4192-a177-24df63e621eb/Standalone_premium_widescreen_editorial_digital_painting__ri.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2JmMTU4NmRhM2U0YmIyZSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTMzMTE4MX0.z01u4g6R3hq8YkCpva0C_aFeAoKOH5xkYofuZMavDTQ'
          SRC_4: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/0c251746-891a-4b09-8a4f-ac2c33d5a5d6/04f46e31-9d3e-452d-935f-fd9322afbbfe/Standalone_premium_widescreen_editorial_digital_painting__ri.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDI5ZDVhYzc4YTNhYzk0MSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTI4MTIyM30.Q-AMc4GYA2uKxQG5z9LgkNTdzZajQjmBiw8Y29-0c08'
          SRC_5: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/0011f389-5a64-4df4-9d96-00d9d2887bed/94bd816f-8fa9-41e8-9580-09d65b116658/Standalone_premium_widescreen_editorial_digital_painting__ri.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTc0Y2EzZWYyNjgyODQ5MiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTMzMjk3NX0.yaYiVEJ4hN4u3SG2UXpc1_199iv0nZzPXHdroKLOuqY'
          SRC_6: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/ebee44d4-512a-4ac3-97a1-b04842987621/651fb3c7-ccc5-4db7-bb89-c038b16c4483/Standalone_premium_widescreen_editorial_digital_painting__ri.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjZkYTUwMGNlZTFiNDk1MiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTMxMDQ3Nn0.gj8XNJe7xMtWJIXN_NsFoLPr1N4DXWvR9BwDMIUKazE'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 - <<'PY'
          import io, os, time, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps
          names=["forklaring-manifest-mekling-reparasjon","forklaring-manifest-algoritmerevisjon","forklaring-grunnlag-innhegning-allmenning","forklaring-grunnlag-ostrom-vann","forklaring-okonomi-arbeidstid-bidrag","forklaring-okonomi-apent-ressursregnskap","forklaring-okonomi-rehabilitering-bolig"]
          dest=Path("assets/illustrasjoner")
          dest.mkdir(exist_ok=True,parents=True)
          for index,name in enumerate(names):
              url=os.environ["SRC_"+str(index)]
              assert url.startswith("https://dnznrvs05pmza.cloudfront.net/"),name
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Paradispartiet-dokumentbilder/1.0"})
                      with urllib.request.urlopen(req,timeout=70) as response:
                          source=response.read(14_000_000)
                      assert 50000<len(source)<14_000_000,(name,len(source))
                      img=ImageOps.exif_transpose(Image.open(io.BytesIO(source))).convert("RGB")
                      assert img.width>=1200 and img.height>=650,(name,img.size)
                      big=dest/(name+".webp")
                      small=dest/(name+"-960.webp")
                      img.save(big,"WEBP",quality=90,method=6)
                      small_img=img.resize((960,round(img.height*960/img.width)),Image.Resampling.LANCZOS)
                      small_img.save(small,"WEBP",quality=84,method=6)
                      for fp in (big,small):
                          data=fp.read_bytes()
                          assert data[:4]==b"RIFF" and data[8:12]==b"WEBP",fp
                      print(name,img.size,big.stat().st_size,small.stat().st_size,flush=True)
                      break
                  except Exception:
                      if attempt==2: raise
                      time.sleep(2*(attempt+1))
          assert len(list(dest.glob("forklaring-*.webp")))==14
          PY
      - name: Lagre bilder i PR-grenen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/illustrasjoner/forklaring-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: sju originale forklaringsmotiver i 14 WEBP-varianter"
            git fetch origin design/illustrasjoner-dokumentforklaringer
            git rebase origin/design/illustrasjoner-dokumentforklaringer
            git push origin HEAD:refs/heads/design/illustrasjoner-dokumentforklaringer
          fi
