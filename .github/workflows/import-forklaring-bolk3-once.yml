name: Engangsimport av tre forklaringsbilder

on:
  pull_request:
    types: [opened, synchronize]
    paths: [".github/workflows/import-forklaring-bolk3-once.yml"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/illustrasjoner-forklaringer-bolk3
          persist-credentials: true
      - name: Hent og optimaliser tre originalillustrasjoner
        env:
          SRC_0: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/baab8a94-8fc4-4418-a80c-2a61bea1bf79/565ab0be-185a-421c-ae67-1231fcc0727b/One_NEW_16_9_standalone__ultra_detailed_painterly_editorial_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODEzNWViYTNkZWMzODdlMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTMyNDE5NX0.ELonuyJ0Pg1xojXeQvLQ26o9hElNhZBfEIzX0lT2MkU'
          SRC_1: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/0c84a01a-d14f-48a4-aea8-f67d2e282c1f/2816cb1f-365e-45d2-8092-7ce1fb19a98a/One_NEW_16_9_standalone__ultra_detailed_painterly_editorial_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmRmMTYwNTM1YjQwMWZmNyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTI4OTY4M30.cFsLKfZkW7jMAd6GfrcJXd9SGvOA8eQzndRt465RxkE'
          SRC_2: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-nano-banana-2.1/images/895fdd08-27b9-4a1f-b0a0-77499ecf3081/ee2f4982-d087-4aec-911d-491cfc0b23bf/One_NEW_16_9_standalone__ultra_detailed_painterly_editorial_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTMwYTE0ODAyMzYwZTE3YiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTMxNDgxNn0.qPh3r2KWcfZc-m4HGGwmDS2hU6UapE1nPeBPxD56vFk'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 - <<'PY'
          import io, os, time, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps
          names=["forklaring-manifest-apen-skole-kveld","forklaring-grunnlag-samfunnskontrakt-maktbegrensning","forklaring-okonomi-produktkort-kvalitet"]
          folder=Path("assets/illustrasjoner")
          folder.mkdir(parents=True,exist_ok=True)
          for i,name in enumerate(names):
              uri=os.environ["SRC_"+str(i)]
              assert uri.startswith("https://dnznrvs05pmza.cloudfront.net/"),name
              for attempt in range(3):
                  try:
                      request=urllib.request.Request(uri,headers={"User-Agent":"Paradispartiet-illustrasjonsimport/1.0"})
                      with urllib.request.urlopen(request,timeout=70) as response:
                          raw=response.read(14_000_000)
                      assert 50000<len(raw)<14_000_000,(name,len(raw))
                      im=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert("RGB")
                      assert im.width>=1200 and im.height>=650,(name,im.size)
                      big=folder/(name+".webp")
                      small=folder/(name+"-960.webp")
                      im.save(big,"WEBP",quality=90,method=6)
                      im.resize((960,round(960*im.height/im.width)),Image.Resampling.LANCZOS).save(small,"WEBP",quality=84,method=6)
                      for path in (big,small):
                          data=path.read_bytes()
                          assert data[:4]==b"RIFF" and data[8:12]==b"WEBP" and len(data)>15000,path
                      print(name,im.size,big.stat().st_size,small.stat().st_size,flush=True)
                      break
                  except Exception:
                      if attempt==2: raise
                      time.sleep(2*(attempt+1))
          assert len(list(folder.glob("forklaring-*.webp"))) >= 30
          PY
      - name: Commit WebP-bilder på arbeidsgrenen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/illustrasjoner/forklaring-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: tre unike forklaringsmotiver med seks WebP-varianter"
            git fetch origin design/illustrasjoner-forklaringer-bolk3
            git rebase origin/design/illustrasjoner-forklaringer-bolk3
            git push origin HEAD:refs/heads/design/illustrasjoner-forklaringer-bolk3
          fi
