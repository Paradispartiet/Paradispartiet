      - name: Validate document invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("manifest.html").read_text(encoding="utf-8")
          foundation = Path("grunnlag.html").read_text(encoding="utf-8")

          required_manifest = [
              'id="ufravikelige-rettigheter"',
              'id="skadeprinsippet"',
              'id="vern-mot-dominans"',
              'id="livets-rettigheter"',
              'id="sikkert-digitalt-demokrati"',
              'id="piloter-prover-gjennomforingen"',
          ]
          required_foundation = [
              'id="grunnlag-ufravikelige-rettigheter"',
              'id="grunnlag-skadeprinsipp-og-dominans"',
              'id="grunnlag-innsats-etter-evne"',
              'id="grunnlag-ressursoversikt-uten-overvakning"',
          ]
          for marker in required_manifest:
              if marker not in manifest:
                  raise SystemExit(f"Missing manifest marker: {marker}")
          for marker in required_foundation:
              if marker not in foundation:
                  raise SystemExit(f"Missing foundation marker: {marker}")

          numbers = [int(value) for value in re.findall(r'<h3>\s*(\d+)\.', manifest)]
          if sorted(set(numbers)) != list(range(1, 61)):
              raise SystemExit(f"Manifest chapter numbering changed: {sorted(set(numbers))}")

          for tag in ("section", "article", "aside", "nav"):
              opens = len(re.findall(fr'<{tag}(?:\s|>)', manifest))
              closes = manifest.count(f'</{tag}>')
              if opens != closes:
                  raise SystemExit(f"Unbalanced {tag} in manifest: {opens} opens, {closes} closes")

          if "10–15 timer" not in manifest or "60 m²" not in manifest:
              raise SystemExit("Core rights disappeared from manifest")
          if "forsøksparametere" not in manifest:
              raise SystemExit("Rights/parameters distinction missing")
          PY

      - name: Commit document changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-ten-points.yml
          git add manifest.html grunnlag.html styles.css
          git commit -m "Forankre ufravikelige rettigheter og maktvern"
          git push origin HEAD:agent/ufravikelige-rettigheter-og-maktvern
