name: Kontroller publisert bildeversjon (engang)

on:
  pull_request:
    types: [opened, synchronize]
    paths: [".github/workflows/illustrasjoner-live-baseline-once.yml"]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kontroller de 47 bildene på offentlig GitHub Pages
        run: |
          set -euo pipefail
          node tools/check-live-illustrations.mjs
