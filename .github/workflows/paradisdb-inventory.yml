name: ParadisDB inventory consistency
on:
  pull_request:
    paths:
      - docs/DATABASE_REGISTER.md
      - docs/paradisdb-inventory.json
      - tools/build_paradisdb_inventory.py
      - .github/workflows/paradisdb-inventory.yml
  push:
    branches: [main]
    paths:
      - docs/DATABASE_REGISTER.md
      - docs/paradisdb-inventory.json
      - tools/build_paradisdb_inventory.py
      - .github/workflows/paradisdb-inventory.yml
permissions:
  contents: read
jobs:
  verify-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate generated metadata against authoritative register
        run: python3 tools/build_paradisdb_inventory.py --check
