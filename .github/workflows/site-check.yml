name: Kontroller nettsiden

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sjekk interne lenker og anker-ID-er
        run: node tools/check-site.mjs
      - name: Kontroller illustrasjonsfiler og sidemapping
        run: node tools/check-illustrations.mjs

  illustration-browser:
    if: github.event_name == 'pull_request' && github.head_ref == 'design/illustrerte-sider-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer testnettleser
        run: |
          npm init --yes >/dev/null
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Start lokal testserver
        run: |
          python3 -m http.server 8765 --directory .. --bind 127.0.0.1 > /tmp/illustration-http.log 2>&1 &
          sleep 2
      - name: Kontroller mobil, iPad og desktop
        run: node tools/check-illustration-browser.mjs
      - name: Lagre skjermbilder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: illustrasjoner-mobil-ipad-desktop
          path: illustration-screenshots/
          if-no-files-found: ignore
